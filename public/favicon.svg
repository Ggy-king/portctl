<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 端口管家图标：暗色圆角底 + 粉色网口 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#262130"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#5a3a4a" stroke-width="2"/>
  <!-- 网口外框 -->
  <path d="M18 26 h28 v10 l-6 6 h-16 l-6 -6 z" fill="none" stroke="#e59bb5" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 四根针脚 -->
  <g stroke="#e59bb5" stroke-width="3.5" stroke-linecap="round">
    <line x1="24" y1="30" x2="24" y2="36"/>
    <line x1="30" y1="30" x2="30" y2="36"/>
    <line x1="36" y1="30" x2="36" y2="36"/>
    <line x1="42" y1="30" x2="42" y2="36"/>
  </g>
  <!-- 下面那根线，表示"连着" -->
  <line x1="32" y1="42" x2="32" y2="52" stroke="#9fd6a8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="55" r="2.6" fill="#9fd6a8"/>
</svg>
