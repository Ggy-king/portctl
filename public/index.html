<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>端口管家</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-l">
    <h1>端口管家 <span class="plat" id="plat"></span></h1>
    <div class="tabs">
      <button class="tab on" data-view="ports">端口 <span class="badge" id="portBadge"></span></button>
      <button class="tab" data-view="log">停止记录 <span class="badge" id="logBadge"></span></button>
    </div>
  </div>
  <div class="head-r">
    <input id="search" type="text" placeholder="搜端口 / 进程 / 标题 / 路径…" autocomplete="off">
    <label class="auto"><input type="checkbox" id="auto"> 自动刷新</label>
    <button id="refresh" class="btn pri">刷新</button>
  </div>
</header>
<main>
  <div id="view-ports">
    <div class="cols">
      <span>端口</span><span>进程 · 路径（点击看详情）</span><span>资源</span><span>网页识别</span><span></span>
    </div>
    <div id="rows"><div class="loading">读取中…</div></div>
  </div>
  <div id="view-log" hidden>
    <div class="cols cols-log"><span>时间</span><span>端口</span><span>被停的进程 · 路径（点击看详情）</span></div>
    <div id="logRows"><div class="loading">读取中…</div></div>
    <div class="foot">只记录从本页面停止的服务 · 自己在终端里 kill 的不会出现在这里</div>
  </div>
  <div class="foot">root 等系统服务会锁住停止按钮 · 本工具只对本机开放 · <span id="platTip"></span></div>
</main>

<!-- 页内弹层（停止确认 / 进程详情，共用骨架） -->
<div id="modal" hidden>
  <div class="modal-box" id="mBox"></div>
</div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
